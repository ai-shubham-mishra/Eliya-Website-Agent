services:
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eliya-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AZURE_AI_PROJECT_ENDPOINT=${AZURE_AI_PROJECT_ENDPOINT:-https://as-eliya-aiservices-stg.services.ai.azure.com/api/projects/as-eliya-aiservices-stg-project}
      - AGENT_NAME=${AGENT_NAME:-as-eliya-website-agent-stg}
      - AGENT_VERSION=${AGENT_VERSION:-latest}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - AZURE_AI_API_KEY=${AZURE_AI_API_KEY:-}
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eliya-agent-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - agent-api
