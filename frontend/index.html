<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eliya Agent Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Markdown parser and sanitizer -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.2/dist/purify.min.js"></script>
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-info">
        <div class="agent-avatar">AI</div>
        <div>
          <h1>Eliya Website Agent</h1>
          <span class="status-badge" id="agentStatus">
            <span class="status-dot"></span> <span id="statusText">Checking connection...</span>
          </span>
        </div>
      </div>
      <div class="header-actions">
        <button id="newSessionBtn" class="btn btn-secondary" title="Start a fresh session">New Session</button>
      </div>
    </header>

    <!-- Session Affinity Bar -->
    <div class="session-bar">
      <div class="session-id-display">
        <span class="label">Session ID (X-Session-Id):</span>
        <code id="sessionIdDisplay">Initializing...</code>
      </div>
      <button id="copySessionBtn" class="btn-icon" title="Copy Session ID">📋</button>
    </div>

    <!-- Message History Area -->
    <main class="chat-messages" id="messagesList">
      <div class="message system-message">
        <div class="message-bubble">
          👋 Welcome to the Eliya Agent interface. Send a message to start a conversation. Your session affinity will be tracked via the <code>X-Session-Id</code> header.
        </div>
      </div>
    </main>

    <!-- Chat Input Area -->
    <footer class="chat-input-wrapper">
      <form id="chatForm" class="chat-form">
        <input
          type="text"
          id="messageInput"
          placeholder="Ask Eliya website agent anything..."
          autocomplete="off"
          required
        />
        <button type="submit" id="sendBtn" class="btn btn-primary">
          <span>Send</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
